    --cds-chart-grid: #e8eaef; --cds-chart-axis: #b7bcc6; --cds-chart-reference: #8b92a0; --cds-chart-muted: #b6bcc7;

  }

<script>
(() => {
  const RAW = __DATA__;
  const PARAMS = {"users":"16","model":"gpt-oss-120b","price":0.39};
  const calcs = {}, subs = [];
  const colors = ['#2f6fdf', '#13a37a', '#d08a12', '#8a4fd8', '#d64f7a', '#5a6170', '#0f8fb8', '#9a7b1c'];
  const run = () => subs.forEach((fn) => { try { fn(); } catch (e) { console.error(e); } });
  const data = (id) => {
    if (RAW[id]) return { status: 'ok', data: RAW[id], columns: Object.keys(RAW[id][0] || {}), refreshing: false, meta: [] };
    const c = calcs[id];
    if (c) {
      try { return { status: 'ok', data: c.fn(...c.inputs.map((i) => data(i).data)), refreshing: false, meta: [] }; }
      catch (e) { console.error(e); return { status: 'error', data: [], message: String(e) }; }
    }
    return { status: 'missing', data: [] };
  };
  // System colors: one hue family per manufacturer, so vendors never look alike, and shades within it. Builds of a
  // system ("DGX Spark (Talos)") take a nearby shade and the main page draws them hollow (dashed lines), so they
  // differ from their solid base by fill too. Checked in OKLab: >= 20 ΔE (x100) between manufacturers, >= 11
  // between same-fill systems of one manufacturer; build outlines >= 2.3:1 on white, >= 4.4:1 on the dark panel.
  // A system not listed gets the next unused shade of its manufacturer.
  const SYS_HEX = {
    'QuietBox 2': '#7447d6', 'QuietBox 2 (DFlash2 speculative, Talos)': '#9b7be8',
    'Tenstorrent p150': '#b0389a', 'Tenstorrent n300': '#e58ad3',
    'DGX Spark': '#2f8a12', 'DGX Spark (Talos)': '#4c9f2e', 'DGX Spark (MTP speculative, Talos)': '#93b81f',
    '2x DGX Spark': '#00806f', '2x DGX Spark (Talos)': '#2aa898',
    'Quadro RTX 6000': '#b9b316',
    'Framework Desktop (Ryzen AI Max+ 395)': '#e0582e',
  };
  const FAMILY_SHADES = {      // spare shades per manufacturer for systems not listed above, in order of use
    Tenstorrent: ['#5a2fa8', '#cfa8f7', '#8e2a7c'],
    NVIDIA: ['#1d5e2e', '#c6e08a', '#2a9d8f'],
    AMD: ['#b8391a', '#f5a07a', '#d97a1a'],
    Apple: ['#2f6fdf', '#8fb4f2', '#1f4fa3'],
    '': ['#c98a00', '#e7b94a', '#8a6a10'],
  };
  const familyGuess = (s) => (/quietbox|tenstorrent|p1[05]0|n[13]00|blackhole|wormhole/i.test(s) ? 'Tenstorrent'
    : /spark|rtx|quadro|nvidia|geforce|jetson|dgx/i.test(s) ? 'NVIDIA'
    : /ryzen|radeon|amd|framework|instinct/i.test(s) ? 'AMD'
    : /\bmac|apple|\bm[1-9]\b/i.test(s) ? 'Apple' : '');
  const base = (s) => s.replace(/\s*\([^)]*\)$/, '');
  const unlisted = {};          // family -> systems given a spare shade, in first-seen order (stable per page)
  const sysColor = (s, family) => {
    if (SYS_HEX[s]) return SYS_HEX[s];
    if (SYS_HEX[base(s)] && /4-chip build/.test(s)) return SYS_HEX[base(s)];   // drawn hollow in its base color
    const fam = family || familyGuess(s), shades = FAMILY_SHADES[fam] || FAMILY_SHADES[''];
    const seen = (unlisted[fam] ??= []);
    if (!seen.includes(s)) seen.push(s);
    return shades[seen.indexOf(s) % shades.length];
  };
  let params = { ...PARAMS };
  window.dash = {
    colors,
    sysColor,
    data,
    calc: (id, spec) => { calcs[id] = spec; },
    loader: () => {},
    onData: (fn) => { subs.push(fn); try { fn(); } catch (e) { console.error(e); } },
    params: () => ({ ...params }),
    setParams: (p) => { params = { ...params, ...p }; run(); },
    resetParams: () => { params = { ...PARAMS }; run(); },
    refresh: () => run(),
    setLink: (name) => { if (name) history.replaceState(null, '', '#' + name); },
  };
  let w = window.innerWidth, t;
  window.addEventListener('resize', () => {
    if (window.innerWidth === w) return;
    w = window.innerWidth; clearTimeout(t); t = setTimeout(run, 150);
  });
})();
</script>
