<!doctype html>
<!-- The social sharing card (docs/og.png, 1200x630): the page title and the systems' legend colors.
     Render with tools/make-og.sh after changing it. Colors match SYS_HEX in shell.html. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #12151a; color: #e8eaee; font-family: "IBM Plex Sans", system-ui, sans-serif;
         padding: 0 96px; display: flex; flex-direction: column; justify-content: center; gap: 56px; }
  h1 { font-family: "Source Serif 4", Georgia, serif; font-weight: 400; font-size: 112px; line-height: 1.0; margin: 0; letter-spacing: -1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 16px 18px; max-width: 1010px; }
  .chip { display: inline-flex; align-items: center; gap: 12px; padding: 12px 22px 12px 18px; border-radius: 999px;
          background: #1b1f26; border: 1px solid #2c323c; font-size: 28px; color: #c9ced8; }
  .chip i { width: 22px; height: 22px; border-radius: 50%; background: var(--c); display: block; }
  .chip.hollow i { background: transparent; box-shadow: inset 0 0 0 4px var(--c); }
</style>
</head>
<body>
  <h1>Best Personal<br>AI Hardware</h1>
  <div class="chips">
    <span class="chip" style="--c: #7447d6"><i></i>QuietBox 2</span>
    <span class="chip" style="--c: #b0389a"><i></i>Tenstorrent p150</span>
    <span class="chip" style="--c: #2f8a12"><i></i>DGX Spark</span>
    <span class="chip hollow" style="--c: #93b81f"><i></i>DGX Spark (MTP)</span>
    <span class="chip" style="--c: #00806f"><i></i>2x DGX Spark</span>
    <span class="chip" style="--c: #e0582e"><i></i>Framework Desktop</span>
  </div>
</body>
</html>
